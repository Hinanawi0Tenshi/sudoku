<section class="view view-home" id="view-home">

       玩家进了游戏就没有回头路——顶栏只在对局页里有。 -->
  <button class="home-back" id="btn-game-exit" data-shell="leave" title="回到标题页，换一款游戏">‹ 换个游戏</button>
  <div class="home-card" id="game-home"></div>
</section>

<!-- 通用整页：设置 / 关于 / 题库 / 每日挑战共用，带返回 -->
<section class="view view-page" id="view-page">

    <button class="btn page-back" id="page-back">‹ 返回</button>
    <h2 class="page-title" id="page-title">设置</h2>
  </header>
  <div class="page-body" id="page-root"></div>
</section>

<!-- 对局页：整块骨架由当前游戏自己建，壳不预设任何控件 -->
<section class="view view-game" id="view-game">
  <div id="game-play"></div>
</section>

<div id="shell-overlay" class="board-overlay shell-overlay" hidden></div>
<div id="dialog-root"></div>
<div id="toast-root" class="toast-root" aria-live="polite"></div>

<script>/*
 * 版本戳：所有静态资源都带 ?v=BUILD。
 *
 * 发布平台不提供可靠的缓存失效手段，同名文件更新后浏览器仍可能拿旧的，
 * 表现就是「明明发了，用户看到的还是老样子」——很难和「压根没发上去」区分开。
 * 加上版本戳后 URL 随构建变化，浏览器必然重新拉，缓存问题从根上消失。
 *
 * 版本号只有一个来源，就是下面这个 BUILD；
 * 它同时写进 window.SD_BUILD，启动时能在「关于」页看到当前跑的是哪一版。
 * 换包时只要改这一处。
 */
window.SD_BUILD = '2026-10-13a';
(function () {
  var v = window.SD_BUILD;
  var nodes = document.querySelectorAll('script[src], link[href]');
  for (var i = 0; i < nodes.length; i++) {
    var n = nodes[i];
    var raw = n.getAttribute(n.tagName === 'SCRIPT' ? 'src' : 'href');
    // 本地锚点与 data URI 不参与版本化
    if (!raw || raw.charAt(0) === '#' || raw.slice(0, 5) === 'data:') continue;
    // 已经带过版本号的（例如运行时动态插入的）不重复加
    if (raw.indexOf('?v=') >= 0) continue;
    n.setAttribute(n.tagName === 'SCRIPT' ? 'src' : 'href', raw + '?v=' + v);
  }
})();
</script>
